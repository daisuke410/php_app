image:
  file: php-postgres-app/.devcontainer/Dockerfile.combined

tasks:
  - name: Start PostgreSQL and PHP Server
    init: |
      echo "Starting PostgreSQL service..."
      sudo service postgresql start
      sleep 5
      echo "Creating database and user..."
      sudo -u postgres psql -c "CREATE DATABASE appdb;" || true
      sudo -u postgres psql -c "CREATE USER appuser WITH PASSWORD 'password';" || true
      sudo -u postgres psql -c "GRANT ALL PRIVILEGES ON DATABASE appdb TO appuser;" || true
      cd /workspace/php-postgres-app
      echo "Initializing database..."
      export DB_HOST=localhost
      export DB_NAME=appdb
      export DB_USER=appuser
      export DB_PASSWORD=password
      php src/init_db.php
      echo "Running migrations..."
      php src/run_migration.php
    command: |
      cd /workspace/php-postgres-app
      export DB_HOST=localhost
      export DB_NAME=appdb
      export DB_USER=appuser
      export DB_PASSWORD=password
      echo "Starting PHP server on port 8080..."
      php -S 0.0.0.0:8080 -t src

ports:
  - port: 8080
    onOpen: open-preview
    visibility: public
  - port: 5432
    onOpen: ignore
    visibility: private

vscode:
  extensions:
    - felixfbecker.php-intellisense
    - bmewburn.vscode-intelephense-client
    - cweijan.vscode-postgresql-client2
    - ms-azuretools.vscode-docker
